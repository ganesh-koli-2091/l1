openapi: "3.0.0"
info:
  title: Order Service
  version: "1.0.0"
  description: Manages the full lifecycle of customer orders including creation, retrieval, cancellation, and status tracking.
servers:
  - url: /api/v1
paths:
  /orders:
    get:
      summary: List orders with optional filters
      description: Returns a paginated list of orders. Use the customerId parameter to retrieve order history for a specific customer. Supports filtering by status and date range.
      tags: [orders]
      parameters:
        - name: customerId
          in: query
          required: false
          description: Filter orders by customer UUID — use this to get a customer's full order history
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter by order status
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled]
        - name: fromDate
          in: query
          required: false
          description: Return orders created on or after this date (ISO 8601)
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          description: Return orders created on or before this date (ISO 8601)
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
    post:
      summary: Create a new order
      description: Creates a new order from the customer's active cart. The cart is automatically cleared upon successful order creation. Triggers payment processing immediately.
      tags: [orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, paymentMethodId, shippingAddressId]
              properties:
                customerId:
                  type: string
                  format: uuid
                paymentMethodId:
                  type: string
                shippingAddressId:
                  type: string
                promoCode:
                  type: string
                  description: Optional promotional code for discount
      responses:
        "201":
          description: Order created and payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          description: Invalid request or empty cart
        "402":
          description: Payment processing failed
  /orders/{orderId}:
    get:
      summary: Get a single order by ID
      description: Retrieves complete details of a specific order including all line items, pricing, shipping address, and current status.
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          description: The UUID of the order to retrieve
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "404":
          description: Order not found
  /orders/{orderId}/cancel:
    post:
      summary: Cancel an order
      description: Cancels an order that is in pending or processing status. Orders in shipped or delivered status cannot be cancelled. A refund is automatically triggered if payment was already captured.
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Human-readable cancellation reason (stored for reporting)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order cancelled successfully
        "409":
          description: Cannot cancel — order status does not allow cancellation (shipped or delivered)
  /orders/{orderId}/status:
    get:
      summary: Get order status and history timeline
      description: Returns the current status of an order along with a full status history timeline showing when each status transition occurred.
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current status with history
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  currentStatus:
                    type: string
                    enum: [pending, processing, shipped, delivered, cancelled]
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        note:
                          type: string
components:
  schemas:
    Order:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        customerId:
          type: string
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              productName:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: number
              lineTotal:
                type: number
        subtotal:
          type: number
        discountAmount:
          type: number
        taxAmount:
          type: number
        totalAmount:
          type: number
        currency:
          type: string
          default: USD
        shippingAddressId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
