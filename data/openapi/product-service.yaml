openapi: "3.0.0"
info:
  title: Product Service
  version: "1.0.0"
  description: Manages the product catalog including listing, search, and SKU-based lookup for the ShopCo platform.
servers:
  - url: /api/v1
paths:
  /products:
    get:
      summary: List products with filtering and sorting
      description: Returns a paginated product catalog. Supports filtering by category, price range, and availability. Sort by price, rating, or newest.
      tags: [products]
      parameters:
        - name: category
          in: query
          required: false
          description: Filter by product category slug (e.g. electronics, clothing)
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
        - name: inStock
          in: query
          required: false
          description: If true, return only products with available inventory
          schema:
            type: boolean
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [price_asc, price_desc, rating, newest]
            default: newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 24
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                  page:
                    type: integer
  /products/search:
    get:
      summary: Full-text search across products
      description: Searches product name, description, and tags using full-text search. Returns results ranked by relevance score. Use this for keyword-based discovery rather than browsing by category.
      tags: [products]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string (minimum 2 characters)
          schema:
            type: string
            minLength: 2
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Search results with relevance scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Product'
                        - type: object
                          properties:
                            relevanceScore:
                              type: number
                  total:
                    type: integer
                  query:
                    type: string
  /products/{productId}:
    get:
      summary: Get product by ID
      description: Retrieves full product details including all variants, images, specifications, and current pricing.
      tags: [products]
      parameters:
        - name: productId
          in: path
          required: true
          description: UUID of the product
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        "404":
          description: Product not found
  /products/sku/{sku}:
    get:
      summary: Get product by SKU
      description: Looks up a product by its Stock Keeping Unit code. Use this when you have a SKU from an order line item and need full product details.
      tags: [products]
      parameters:
        - name: sku
          in: path
          required: true
          description: The product SKU code (e.g. ELEC-LP-001-BLK)
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product matching the SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        "404":
          description: No product found for this SKU
components:
  schemas:
    Product:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        price:
          type: number
        currency:
          type: string
          default: USD
        thumbnailUrl:
          type: string
        rating:
          type: number
          minimum: 0
          maximum: 5
        reviewCount:
          type: integer
        inStock:
          type: boolean
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            description:
              type: string
            sku:
              type: string
            weight:
              type: number
            dimensions:
              type: object
              properties:
                length:
                  type: number
                width:
                  type: number
                height:
                  type: number
            images:
              type: array
              items:
                type: string
            variants:
              type: array
              items:
                type: object
                properties:
                  variantId:
                    type: string
                  sku:
                    type: string
                  attributes:
                    type: object
                  price:
                    type: number
                  inStock:
                    type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
